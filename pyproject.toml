[project]
name = "focus-mcp"
version = "0.4.0"
description = "MCP server for querying FOCUS cloud billing data with DuckDB"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Glassity" }]
keywords = ["focus", "finops", "mcp", "billing", "duckdb", "cloud-cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "duckdb>=1.3.2,<2",
    "mcp[cli]>=2.1.1,<3",
    "httpx>=0.27",
    "pandas>=2.3.2,<3",
    "pydantic>=2,<3",
    "pyyaml>=6.0.0,<7",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/glassity/focus-mcp"
Website = "https://glassity.cloud/?utm_source=focus-mcp&utm_medium=pypi"
Repository = "https://github.com/glassity/focus-mcp"
Issues = "https://github.com/glassity/focus-mcp/issues"

[project.scripts]
focus-mcp = "focus_mcp.server:main"

[project.optional-dependencies]
gcs = [
    "gcsfs>=2024.6.0",
]
auth = [
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/focus_mcp"]
# The upstream baselines are what CI measures the curated collections
# against; no runtime code reads them, so shipping them would double the
# query payload for data no user can reach.
exclude = ["src/focus_mcp/resources/queries/upstream"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "beautifulsoup4>=4.13.5",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
