  column_type: Dimension
  feature_level: Mandatory
  allows_nulls: 'False'
  data_type: Date/Time
  value_format: Date/Time Format
  introduced_version: '0.5'
- display_name: Commitment Discount Category
  column_id: CommitmentDiscountCategory
