- display_name: Charge Category
  column_id: ChargeCategory
  description: Represents the highest-level classification of a *charge* based on the nature of how it is billed.
  allowed_values:
  - value: Usage
    description: Positive or negative *charges* based on the quantity of a service or resource that was consumed over a given period of time including refunds.
  - value: Purchase
    description: Positive or negative *charges* for the acquisition of a service or resource bought upfront or on a recurring basis including refunds.
  - value: Tax
    description: Positive or negative applicable taxes that are levied by the relevant authorities including refunds. Tax *charges* may vary depending on factors such as the location, jurisdiction, and local or federal regulations.
  - value: Credit
    description: Positive or negative *charges* granted by the service provider for various scenarios e.g., promotional credits or corrections to promotional credits.
  - value: Adjustment
    description: Positive or negative *charges* the service provider applies that do not fall into other category values.
  column_type: Dimension
  feature_level: Mandatory
  allows_nulls: 'False'
  data_type: String
  value_format: Allowed values
  introduced_version: '0.5'
- display_name: Charge Class
  column_id: ChargeClass
  description: Indicates whether a *charge* represents a correction to a previously *closed billing period*.
  allowed_values:
  - value: Correction
    description: Correction to a previously *closed billing period* (e.g., refunds and credit modifications).
  column_type: Dimension
  feature_level: Mandatory
  allows_nulls: 'True'
  data_type: String
  value_format: Allowed values
  introduced_version: '1.0'
- display_name: Charge Description
  column_id: ChargeDescription
  description: Self-contained summary of the *charge's* purpose and price.
  column_type: Dimension
  feature_level: Mandatory
  allows_nulls: 'True'
  data_type: String
  value_format: \<not specified>
  introduced_version: 1.0-preview
- display_name: Charge Frequency
  column_id: ChargeFrequency
  description: Indicates how often a *charge* will occur.
  allowed_values:
  - value: One-Time
    description: '*Charges* that only happen once and will not repeat. One-time *charges* are typically recorded on the hour or day when the cost was incurred.'
  - value: Recurring
    description: '*Charges* that repeat on a periodic cadence (e.g., weekly, monthly) regardless of whether the product or *service* was used. Recurring *charges* typically happen on the same day or point within every period. The charge date does not change based on how or when the *service* is used.'
  - value: Usage-Based
    description: '*Charges* that repeat every time the *service* is used. Usage-based *charges* are typically recorded hourly or daily, based on the granularity of the cost data for the period when the *service* was used (referred to as *charge period*). Usage-based *charges* are not recorded when the *service* is not used.'
  column_type: Dimension
  feature_level: Recommended
  allows_nulls: 'False'
  data_type: String
  value_format: Allowed values
  introduced_version: 1.0-preview
- display_name: Charge Period End
  column_id: ChargePeriodEnd
  description: The *exclusive end bound* of a *charge period*.
  column_type: Dimension
  feature_level: Mandatory
  allows_nulls: 'False'
  data_type: Date/Time
  value_format: Date/Time Format
  introduced_version: '0.5'
- display_name: Charge Period Start
