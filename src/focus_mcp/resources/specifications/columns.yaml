- display_name: Pricing Category
  column_id: PricingCategory
  description: Describes the pricing model used for a *charge* at the time of use or purchase.
  allowed_values:
  - value: Standard
    description: '*Charges* priced at the agreed upon rate for the billing account, including *negotiated discounts*. This pricing includes any flat rate and volume/tiered pricing but does not include dynamic pricing or reduced pricing due to the application of a *commitment discount*. This does include the purchase of a commitment discount at agreed upon rates.'
  - value: Dynamic
    description: '*Charges* priced at a variable rate determined by the service provider. This includes any product or service with a unit price the service provider can change without notice, like interruptible or low priority *resources*.'
  - value: Committed
    description: '*Charges* with reduced pricing due to the application of the *commitment discount* specified by the Commitment Discount ID.'
  - value: Other
    description: '*Charges* priced in a way not covered by another pricing category.'
  column_type: Dimension
  feature_level: Conditional
  allows_nulls: 'True'
  data_type: String
  value_format: Allowed values
  introduced_version: 1.0-preview
- display_name: Pricing Quantity
