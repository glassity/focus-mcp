title: Report costs by service category
slug: report-costs-by-service-category
source_url: https://focus.finops.org/use-case/report-costs-by-service-category/
description: Understanding costs across service providers, billing periods, and service categories (Analytics, Compute, Database, Storage, etc.) provides valuable insight into total costs.
sql: |-
  SELECT
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? and BillingPeriodEnd < ?
  GROUP BY
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory
  ORDER BY TotalBilledCost DESC
divergence_note: Upstream publishes different SQL for 1.3 than for 1.2.
