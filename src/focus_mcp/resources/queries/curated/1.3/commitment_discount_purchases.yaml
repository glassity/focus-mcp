title: Report commitment discount purchases
slug: report-commitment-discount-purchases
source_url: https://focus.finops.org/use-case/report-commitment-discount-purchases/
description: Tracking and reconciling commitment-based discount purchases across service providers is a key to success for FinOps.
sql: |-
  SELECT
    MIN(ChargePeriodStart) AS ChargePeriodStart,
    MAX(ChargePeriodEnd) AS ChargePeriodEnd,
    ServiceProviderName,
    BillingAccountId,
    CommitmentDiscountId,
    CommitmentDiscountType,
    CommitmentDiscountUnit,
    CommitmentDiscountQuantity,
    ChargeFrequency,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? AND ChargePeriodEnd < ?
    AND ChargeCategory = 'Purchase'
    AND CommitmentDiscountId IS NOT NULL
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    CommitmentDiscountId,
    CommitmentDiscountType,
    CommitmentDiscountUnit,
    CommitmentDiscountQuantity,
    ChargeFrequency
