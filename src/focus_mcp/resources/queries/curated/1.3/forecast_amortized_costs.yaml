title: Forecast amortized costs month over month based on historical trends
slug: forecast-amortized-costs-month-over-month-based-on-historical-trends-2
source_url: https://focus.finops.org/use-case/forecast-amortized-costs-month-over-month-based-on-historical-trends-2/
description: Finance needs to perform month over month forecasting by extrapolating amortized costs based on historical rates. Having this data enables Finance to create amortized cost models.
sql: |-
  SELECT
    MONTH(BillingPeriodStart),
    ServiceProviderName,
    ServiceCategory,
    ServiceName,
    ChargeCategory,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ?  AND BillingPeriodEnd < ?
  GROUP BY
    MONTH(BillingPeriodStart),
    ServiceProviderName,
    ServiceCategory,
    ServiceName,
    ChargeCategory
