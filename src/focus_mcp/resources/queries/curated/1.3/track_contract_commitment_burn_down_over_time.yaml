# Runs as written. Any difference from the matching file under
# upstream/ must be explained by fix_comment; see CONTRIBUTING.md.

fix_comment: MySQL-only constructs upstream ships untested against DuckDB. json_extract_array becomes json_extract(x, '$[*]'). json_extract_array is MySQL-only; DuckDB's json_extract returns a list only when the path selects every element, so [*] is appended for UNNEST. FLOAT64 is a BigQuery type; DOUBLE is the DuckDB equivalent. UNNEST(...) AS X aliases the derived table, not the column, so every reference to X returns NULL; AS _u(X) names the column.
title: Track contract commitment burn-down over time
slug: track-contract-commitment-burn-down-over-time
source_url: https://focus.finops.org/use-case/track-contract-commitment-burn-down-over-time/
description: Monitor the consumption of contract commitments across billing periods to track progress toward fulfilling contractual obligations and identify potential under-utilization risks.
sql: |-
  SELECT
    CU.BillingPeriodStart,
    CU.ServiceProviderName,
    CU.BillingAccountId,
    JSON_VALUE(CA, '$.ContractCommitmentID') AS ContractCommitmentId,
    SUM(CAST(JSON_VALUE(CA, '$.ContractCommitmentAppliedCost') AS DOUBLE)) AS AppliedCost,
    SUM(CU.EffectiveCost) AS TotalEffectiveCost
   FROM focus_data_table CU
   CROSS JOIN
    UNNEST(json_extract(CU.ContractApplied, '$.Elements[*]')) AS _u(CA)
   WHERE JSON_VALUE(CA, '$.ContractCommitmentID') IS NOT NULL
    AND BillingPeriodStart >= ? AND BillingPeriodStart < ?
   GROUP BY
    CU.BillingPeriodStart,
    CU.ServiceProviderName,
    CU.BillingAccountId,
    JSON_VALUE(CA, '$.ContractCommitmentID')
   ORDER BY BillingPeriodStart, ContractCommitmentId
