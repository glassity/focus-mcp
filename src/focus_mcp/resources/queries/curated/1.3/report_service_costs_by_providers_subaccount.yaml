fix_comment: ORDER BY referenced BillingPeriodStart, which is not in the GROUP BY; ChargePeriodStart is the grouped period column.
title: Report service costs by providers subaccount
slug: report-service-costs-by-providers-subaccount-2
source_url: https://focus.finops.org/use-case/report-service-costs-by-providers-subaccount-2/
description: Organizations wants to negotiate private pricing for a particular workload, a subaccount that carries specialized workloads, or their entire footprint. The cost metric used must amortize up-front and recurring fees to get an accurate view of the effective cost.
sql: "SELECT \n  ServiceProviderName,\n  ServiceName,\n  SubAccountId,\n  ChargePeriodStart,\n  SUM(EffectiveCost) AS TotalEffectiveCost\nFROM focus_data_table\nWHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?\n  AND SubAccountId = ?\n  AND ServiceProviderName = ?\nGROUP BY \n  ServiceProviderName,\n  ServiceName,\n  SubAccountId,\n  ChargePeriodStart\nORDER BY \n  SUM(EffectiveCost),\n  ChargePeriodStart DESC"
