title: Verify discount accuracy for a previously invoiced billing period (corrections excluded)
slug: verify-discount-accuracy-for-a-previously-invoiced-billing-period-corrections-excluded
source_url: https://focus.finops.org/use-case/verify-discount-accuracy-for-a-previously-invoiced-billing-period-corrections-excluded/
description: FinOps Practitioners need to confirm that negotiated, live, and commitment-based discounts were correctly applied to charges in a closed billing period.
sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    BillingAccountName,
    BillingCurrency,
    ServiceName,
    SUM(EffectiveCost) AS TotalEffectiveCost,
    SUM(ListCost) AS TotalListCost,
    SUM(BilledCost) AS TotalBilledCost,
    ((SUM(ListCost) - SUM(EffectiveCost)) / NULLIF(SUM(ListCost), 0)) * 100 AS EffectiveDiscount
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
    AND ChargeClass != 'Correction'
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    BillingAccountName,
    BillingCurrency,
    ServiceName
