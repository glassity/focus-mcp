# Runs as written. Any difference from the matching file under
# upstream/ must be explained by fix_comment; see CONTRIBUTING.md.

fix_comment: Tags["key"] is not DuckDB syntax; Tags->>'key' is.
title: Update budgets for each application
slug: update-budgets-for-each-application
source_url: https://focus.finops.org/use-case/update-budgets-for-each-application/
description: Finance manages tracking of budgets and must update application budgets with the actual costs billed each month so the budget is not exceeded.
sql: |-
  SELECT
    ServiceProviderName,
    BillingPeriodStart,
    BillingPeriodEnd,
    Tags->>'Application' AS Application,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
  GROUP BY
    ServiceProviderName,
    BillingPeriodStart,
    BillingPeriodEnd,
    Tags->>'Application'
