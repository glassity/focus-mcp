title: Forecast cashflow month over month based on historical trends by service
slug: forecast-cashflow-month-over-month-based-on-historical-trends-by-service-2
source_url: https://focus.finops.org/use-case/forecast-cashflow-month-over-month-based-on-historical-trends-by-service-2/
description: Finance needs to perform month over month forecasting of cashflow by extrapolating from historical cash costs. Having this data enables Finance to create cashflow cost models.
sql: |-
  SELECT
    MONTH(BillingPeriodStart),
    ServiceProviderName,
    ServiceCategory,
    ServiceName,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
  GROUP BY
    MONTH(BillingPeriodStart),
    ServiceProviderName,
    ServiceCategory,
    ServiceName
