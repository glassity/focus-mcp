title: Analyze costs by availability zone for a subaccount
slug: analyze-costs-by-availability-zone-for-a-subaccount
source_url: https://focus.finops.org/use-case/analyze-costs-by-availability-zone-for-a-subaccount/
description: 'It is good practice for Engineering to monitor cost and usage of services by availability zone for all regions to ensure: there isn''t any cost/usage occurring outside of the expected locations your costs are spread according to an expected ratio'
sql: |-
  SELECT
    ServiceProviderName,
    RegionName,
    AvailabilityZone,
    BillingPeriodStart,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE SubAccountId = ?
    AND ChargePeriodStart >= ? AND ChargePeriodEnd < ?
  GROUP BY
    ServiceProviderName,
    RegionName,
    AvailabilityZone,
    BillingPeriodStart
   ORDER BY ServiceProviderName,
    RegionName,
    AvailabilityZone,
    BillingPeriodStart
