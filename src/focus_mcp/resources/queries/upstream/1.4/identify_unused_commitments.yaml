title: Identify unused commitments
slug: identify-unused-commitments-2
source_url: https://focus.finops.org/use-case/identify-unused-commitments-2/
description: Identify all data in a time period where CommitmentDiscountStatus is unused, thus identifying commitments that aren't used and enabling the Practitioner to take action on either selling the commitment (if able), working with other personas on a workload that could use the commitment, or performing informed ignore (knowing it is there but ignoring it because there is nothing one can do).
sql: |-
  SELECT
    MIN(ChargePeriodStart) AS ChargePeriodStart,
    MAX(ChargePeriodEnd) AS ChargePeriodEnd,
    ServiceProviderName,
    BillingAccountId,
    CommitmentDiscountId,
    CommitmentDiscountType,
    CommitmentDiscountStatus,
    SUM(BilledCost) AS TotalBilledCost,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? AND ChargePeriodEnd < ?
    AND CommitmentDiscountStatus = 'Unused'
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    CommitmentDiscountId,
    CommitmentDiscountType,
    CommitmentDiscountStatus
