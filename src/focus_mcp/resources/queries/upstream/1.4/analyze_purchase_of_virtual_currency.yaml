title: Analyze purchase of virtual currency
slug: analyze-purchase-of-virtual-currency-2
source_url: https://focus.finops.org/use-case/analyze-purchase-of-virtual-currency-2/
description: Analyze virtual-currency purchase patterns (e.g., upfront) and actively monitor burn down to prevent overage charges.
sql: |-
  SELECT
      ServiceProviderName,
      ChargeDescription,
      PricingUnit,
      BillingCurrency,
      SUM(PricingQuantity) AS TotalPricingQuantity,
      SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? and ChargePeriodEnd  < ?
      AND ChargeCategory = 'Purchase'
       AND PricingUnit = ?
  GROUP BY
      ServiceProviderName,
      ChargeDescription,
      PricingUnit,
      BillingCurrency
