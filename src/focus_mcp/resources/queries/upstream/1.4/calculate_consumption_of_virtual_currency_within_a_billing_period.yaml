# Verbatim from the FinOps Foundation. Do not edit by hand: this is
# the baseline every local correction is measured against.

title: Calculate consumption of virtual currency within a billing period
slug: calculate-consumption-of-virtual-currency-within-a-billing-period-2
source_url: https://focus.finops.org/use-case/calculate-consumption-of-virtual-currency-within-a-billing-period-2/
description: Track virtual-currency burn throughout the billing period to forecast exhaustion dates and stay within budget.
sql: "SELECT \n    ServiceProviderName,\n    SUM(PricingCurrencyEffectiveCost) AS TotalPricingCurrencyEffectiveCost\nFROM focus_data_table\nWHERE ChargePeriodStart >= ? and ChargePeriodEnd  < ?\nAND PricingCurrency = ?\nAND ChargeCategory = 'Usage'\nGROUP BY\n    ServiceProviderName\nORDER BY TotalPricingCurrencyEffectiveCost DESC\nLIMIT 10"
