title: Identify anomalous daily spending by subaccount, region, and service
slug: identify-anomalous-daily-spending-by-subaccount-region-and-service
source_url: https://focus.finops.org/use-case/identify-anomalous-daily-spending-by-subaccount-region-and-service/
description: It is important for FinOps Practitioners to track daily spend from various angles to ensure any anomalous cost trends are easily detected. Tracking by region and service enables further granularity in understanding the source of anomalous spend. Purchases can often cause false positives, for this reason, we want to monitor cost trends with up-front payments amortized. Graphing the data by day in a multiline chart can often help find the outliers.
sql: |-
  SELECT
    DATE(ChargePeriodStart) AS Day,
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName,
    ServiceName,
    SUM(EffectiveCost) AS DailyEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? and ChargePeriodEnd  < ?
  GROUP BY
    DATE(ChargePeriodStart) AS StartDay,
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName,
    ServiceName
